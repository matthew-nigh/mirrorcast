[project]
name = "mirrorcast"
version = "1.2.1"
description = "Mirror a Windows screen to a Chromecast"
authors = [{ name = "M. Nigh" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
